<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2a5a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Minion Rush — Banana Dash</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23ffd93d'/%3E%3Ccircle cx='36' cy='44' r='15' fill='%23fff' stroke='%23333' stroke-width='6'/%3E%3Ccircle cx='64' cy='44' r='15' fill='%23fff' stroke='%23333' stroke-width='6'/%3E%3Ccircle cx='36' cy='46' r='6' fill='%233b2a1a'/%3E%3Ccircle cx='64' cy='46' r='6' fill='%233b2a1a'/%3E%3Cpath d='M32 70 Q50 84 68 70' stroke='%233b2a1a' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="Minion Rush 3D endless runner"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <!-- ================= HUD ================= -->
    <div id="hud" class="hud hidden" aria-live="polite">
      <div class="hud-row">
        <div class="banana-chip">
          <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 8c4 11 12 19 24 20-2 7-10 8-16 3C9 25 5 16 9 8Z" fill="#ffd93d" stroke="#c48900" stroke-width="2.5"/><path d="M9 8c-2-1-4 1-3 3" stroke="#7a5a17" stroke-width="4" stroke-linecap="round"/><path d="M30 28c1 2 2 4 1 6" stroke="#7a5a17" stroke-width="4" stroke-linecap="round"/></svg>
          <span id="hud-bananas">0</span>
        </div>
        <div class="score-wrap">
          <div id="hud-score">0</div>
          <div class="score-label">SCORE</div>
        </div>
        <button id="btn-pause" class="round-btn" aria-label="Pause game">
          <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
        </button>
      </div>
      <div id="power-strip" class="power-strip"></div>
      <div id="combo" class="combo hidden"></div>
      <div id="hint" class="hint hidden">
        <span class="swipe-row"><b>←</b> swipe <b>→</b></span>
        <span><b>↑</b> jump &nbsp;·&nbsp; <b>↓</b> roll</span>
      </div>
    </div>

    <!-- ================= MENU ================= -->
    <div id="menu" class="screen menu-screen">
      <div class="menu-head">
        <div class="logo" aria-label="Minion Rush">
          <span class="logo-minion">MINION</span>
          <span class="logo-rush">RUSH</span>
          <span class="logo-tag">BANANA DASH</span>
        </div>
        <div class="best-pill">BEST <b id="menu-best">0</b></div>
      </div>

      <div class="menu-foot">
        <div class="pick-title">PICK YOUR MINION</div>
        <div id="skin-row" class="skin-row" role="radiogroup" aria-label="Choose a minion skin"></div>

        <button id="btn-play" class="play-btn" aria-label="Play">
          <span class="play-icon">▶</span> PLAY
        </button>

        <div class="menu-actions">
          <button id="btn-tilt" class="tilt-toggle" aria-pressed="false">
            <span class="tilt-ico">📱</span>
            <span class="tilt-text">Tilt steering</span>
            <span class="switch"><i></i></span>
          </button>
          <button id="btn-sound" class="round-btn sound-btn" aria-label="Toggle sound">
            <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4Z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
            <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4Z"/><path d="m16 9 5 6m0-6-5 6" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>

        <p class="controls-hint" id="controls-hint">
          Swipe <b>← →</b> to dodge · <b>↑</b> jump · <b>↓</b> roll
        </p>
      </div>
    </div>

    <!-- ================= PAUSE ================= -->
    <div id="pause" class="screen overlay hidden">
      <div class="modal">
        <h2 class="modal-title">PAUSED</h2>
        <p class="modal-sub">Catch your breath. The bananas can wait.</p>
        <div class="modal-stats">
          <div><span id="pause-score">0</span><small>SCORE</small></div>
          <div><span id="pause-bananas">0</span><small>BANANAS</small></div>
        </div>
        <button id="btn-resume" class="play-btn small">RESUME</button>
        <button id="btn-quit" class="ghost-btn">QUIT TO MENU</button>
      </div>
    </div>

    <!-- ================= GAME OVER ================= -->
    <div id="gameover" class="screen overlay hidden">
      <div class="modal">
        <div id="new-best" class="new-best hidden">★ NEW BEST ★</div>
        <h2 class="modal-title over-title">SPLAT!</h2>
        <p class="modal-sub" id="over-sub">Bananas everywhere…</p>
        <div class="big-score" id="over-score">0</div>
        <div class="modal-stats">
          <div><span id="over-bananas">0</span><small>BANANAS</small></div>
          <div><span id="over-distance">0m</span><small>DISTANCE</small></div>
          <div><span id="over-best">0</span><small>BEST</small></div>
        </div>
        <button id="btn-again" class="play-btn small">RUN AGAIN</button>
        <button id="btn-menu" class="ghost-btn">CHANGE MINION</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <div id="go-flash" class="go-flash">GO!</div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
